[project]
name = "nextbuy"
version = "0.4.0"
description = "NEXTBUY Discord commerce automation"
requires-python = ">=3.12"
dependencies = [
  "discord.py==2.7.1",
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.2",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "qrcode==8.2",
  "stripe==14.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
